### fps by manual - estimated from JSON metadata (bag_length_seconds)
fps: 30

features:
  observation:
    images:

    ### left head camera - compressed RGB image
    - cam_name: cam_high_left_rgb
      args:
        topic_name: /hdas/camera_head/left_raw/image_raw_color/compressed
      # messages: sensor_msgs/msg/CompressedImage

    ### right head camera - compressed RGB image
    - cam_name: cam_high_right_rgb
      args:
        topic_name: /hdas/camera_head/right_raw/image_raw_color/compressed
      # messages: sensor_msgs/msg/CompressedImage

    ### left wrist camera - compressed RGB image
    - cam_name: cam_left_wrist_rgb
      args:
        topic_name: /hdas/camera_wrist_left/color/image_raw/compressed
      # messages: sensor_msgs/msg/CompressedImage

    ### right wrist camera - compressed RGB image
    - cam_name: cam_right_wrist_rgb
      args:
        topic_name: /hdas/camera_wrist_right/color/image_raw/compressed
      # messages: sensor_msgs/msg/CompressedImage

    ### left wrist camera - depth image (暂时禁用，因为通道数问题)
    # - cam_name: wrist_left_depth
    #   args:
    #     topic_name: /hdas/camera_wrist_left/aligned_depth_to_color/image_raw
    #   # messages: sensor_msgs/msg/Image

    ### right wrist camera - depth image (暂时禁用，因为通道数问题)
    # - cam_name: wrist_right_depth
    #   args:
    #     topic_name: /hdas/camera_wrist_right/aligned_depth_to_color/image_raw
    #   # messages: sensor_msgs/msg/Image

    state:
      ### state data combination: left arm + right arm + left gripper + right gripper
      sub_state:

      ### left arm joint state (7 joints)
      - names: 
        - left_arm_joint_1_rad
        - left_arm_joint_2_rad
        - left_arm_joint_3_rad
        - left_arm_joint_4_rad
        - left_arm_joint_5_rad
        - left_arm_joint_6_rad
        - left_arm_joint_7_rad
        args:
          topic_name: /hdas/feedback_arm_left
          range_from: 0
          range_to: 7
        # messages: sensor_msgs/msg/JointState

      ### right arm joint state (7 joints)
      - names: 
        - right_arm_joint_1_rad
        - right_arm_joint_2_rad
        - right_arm_joint_3_rad
        - right_arm_joint_4_rad
        - right_arm_joint_5_rad
        - right_arm_joint_6_rad
        - right_arm_joint_7_rad
        args:
          topic_name: /hdas/feedback_arm_right
          range_from: 0
          range_to: 7
        # messages: sensor_msgs/msg/JointState

      ### left gripper state (1 joint)
      - names: 
        - left_gripper_open_rad
        args:
          topic_name: /hdas/feedback_gripper_left
          range_from: 0
          range_to: 1
        # messages: sensor_msgs/msg/JointState

      ### right gripper state (1 joint)
      - names: 
        - right_gripper_open_rad
        args:
          topic_name: /hdas/feedback_gripper_right
          range_from: 0
          range_to: 1
        # messages: sensor_msgs/msg/JointState

      ### torso state - 4 joints (修正：实际有4个关节)
      - names: 
        - torso_joint_1_rad
        - torso_joint_2_rad
        - torso_joint_3_rad
        - torso_joint_4_rad
        args:
          topic_name: /hdas/feedback_torso
          range_from: 0
          range_to: 4
        # messages: sensor_msgs/msg/JointState

      ### chassis state - wheels or mobile base (3 chassis) 
      - names: 
        - chassis_wheel_1_rad
        - chassis_wheel_2_rad
        - chassis_wheel_3_rad
        args:
          topic_name: /hdas/feedback_chassis
          range_from: 0
          range_to: 3
        # messages: sensor_msgs/msg/JointState

      ### chassis IMU data - acceleration and angular velocity
      - names:
        - chassis_imu_accel_x_m_s2
        - chassis_imu_accel_y_m_s2
        - chassis_imu_accel_z_m_s2
        - chassis_imu_gyro_x_rad_s
        - chassis_imu_gyro_y_rad_s
        - chassis_imu_gyro_z_rad_s
        args:
          topic_name: /hdas/imu_chassis
          range_from: 0
          range_to: 6
        # messages: sensor_msgs/msg/Imu

      ### torso IMU data
      - names:
        - torso_imu_accel_x_m_s2
        - torso_imu_accel_y_m_s2
        - torso_imu_accel_z_m_s2
        - torso_imu_gyro_x_rad_s
        - torso_imu_gyro_y_rad_s
        - torso_imu_gyro_z_rad_s
        args:
          topic_name: /hdas/imu_torso
          range_from: 0
          range_to: 6
        # messages: sensor_msgs/msg/Imu

  action:
    ### action data: target joint state (time offset version of observation)
    timeline_offset: 1
    sub_action:

    ### left arm target joint state (6 joints)
    - names: 
      - left_arm_joint_1_rad
      - left_arm_joint_2_rad
      - left_arm_joint_3_rad
      - left_arm_joint_4_rad
      - left_arm_joint_5_rad
      - left_arm_joint_6_rad
      args:
        topic_name: /motion_target/target_joint_state_arm_left
        range_from: 0
        range_to: 6
      # messages: sensor_msgs/msg/JointState

    ### right arm target joint state (6 joints)
    - names: 
      - right_arm_joint_1_rad
      - right_arm_joint_2_rad
      - right_arm_joint_3_rad
      - right_arm_joint_4_rad
      - right_arm_joint_5_rad
      - right_arm_joint_6_rad
      args:
        topic_name: /motion_target/target_joint_state_arm_right
        range_from: 0
        range_to: 6
      # messages: sensor_msgs/msg/JointState

    ### left gripper target position (1 joint)
    - names: 
      - left_gripper_open_rad
      args:
        topic_name: /motion_target/target_position_gripper_left
        range_from: 0
        range_to: 1
      # messages: sensor_msgs/msg/JointState

    ### right gripper target position (1 joint)
    - names: 
      - right_gripper_open_rad
      args:
        topic_name: /motion_target/target_position_gripper_right
        range_from: 0
        range_to: 1
      # messages: sensor_msgs/msg/JointState

    ### chassis target velocity (6 dimensions: 3 linear + 3 angular)
    - names:
      - chassis_target_vel_linear_x_m_s
      - chassis_target_vel_linear_y_m_s
      - chassis_target_vel_linear_z_m_s
      - chassis_target_vel_angular_x_rad_s
      - chassis_target_vel_angular_y_rad_s
      - chassis_target_vel_angular_z_rad_s
      args:
        topic_name: /motion_target/target_speed_chassis
        range_from: 0
        range_to: 6
      # messages: geometry_msgs/msg/TwistStamped

    ### torso target velocity (6 dimensions: 3 linear + 3 angular)
    - names:
      - torso_target_vel_linear_x_m_s
      - torso_target_vel_linear_y_m_s
      - torso_target_vel_linear_z_m_s
      - torso_target_vel_angular_x_rad_s
      - torso_target_vel_angular_y_rad_s
      - torso_target_vel_angular_z_rad_s
      args:
        topic_name: /motion_target/target_speed_torso
        range_from: 0
        range_to: 6
      # messages: geometry_msgs/msg/TwistStamped
