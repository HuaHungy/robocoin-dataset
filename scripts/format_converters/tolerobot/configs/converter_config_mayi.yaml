fps: 30
features:
  observation:
    images:
      # 5个 RGB 相机
      - cam_name: camera_realsense_c_rgb
        args:
          cam_name: camera_realsense_c_rgb
          camera_folder: camera_realsense_c
      - cam_name: pikaDepthCamera_l_rgb
        args:
          cam_name: pikaDepthCamera_l_rgb
          camera_folder: pikaDepthCamera_l
      - cam_name: pikaDepthCamera_r_rgb
        args:
          cam_name: pikaDepthCamera_r_rgb
          camera_folder: pikaDepthCamera_r
      - cam_name: pikaFisheyeCamera_l_rgb
        args:
          cam_name: pikaFisheyeCamera_l_rgb
          camera_folder: pikaFisheyeCamera_l
      - cam_name: pikaFisheyeCamera_r_rgb
        args:
          cam_name: pikaFisheyeCamera_r_rgb
          camera_folder: pikaFisheyeCamera_r
      
      # 3个深度相机
      - cam_name: pikaDepthCamera_c_depth
        args:
          cam_name: pikaDepthCamera_c_depth
          camera_folder: pikaDepthCamera_c
          is_depth: true
      - cam_name: pikaDepthCamera_l_depth
        args:
          cam_name: pikaDepthCamera_l_depth
          camera_folder: pikaDepthCamera_l
          is_depth: true
      - cam_name: pikaDepthCamera_r_depth
        args:
          cam_name: pikaDepthCamera_r_depth
          camera_folder: pikaDepthCamera_r
          is_depth: true

    state:
      sub_state:
        # 左夹爪 (angle + distance)
        - names:
            - mayi_left_gripper_angle
          args:
            data_type: gripper
            gripper_side: pika_l
            field_name: angle
        - names:
            - mayi_left_gripper_distance
          args:
            data_type: gripper
            gripper_side: pika_l
            field_name: distance
        
        # 右夹爪 (angle + distance)
        - names:
            - mayi_right_gripper_angle
          args:
            data_type: gripper
            gripper_side: pika_r
            field_name: angle
        - names:
            - mayi_right_gripper_distance
          args:
            data_type: gripper
            gripper_side: pika_r
            field_name: distance
        
        # 左手 IMU (10个维度: 3 angular_velocity + 3 linear_acceleration + 4 orientation)
        - names:
            - mayi_left_imu_angular_velocity_x
            - mayi_left_imu_angular_velocity_y
            - mayi_left_imu_angular_velocity_z
          args:
            data_type: imu
            imu_side: pika_l
            field_name: angular_velocity
            subfields: [x, y, z]
        - names:
            - mayi_left_imu_linear_acceleration_x
            - mayi_left_imu_linear_acceleration_y
            - mayi_left_imu_linear_acceleration_z
          args:
            data_type: imu
            imu_side: pika_l
            field_name: linear_acceleration
            subfields: [x, y, z]
        - names:
            - mayi_left_imu_orientation_w
            - mayi_left_imu_orientation_x
            - mayi_left_imu_orientation_y
            - mayi_left_imu_orientation_z
          args:
            data_type: imu
            imu_side: pika_l
            field_name: orientation
            subfields: [w, x, y, z]
        
        # 右手 IMU (10个维度)
        - names:
            - mayi_right_imu_angular_velocity_x
            - mayi_right_imu_angular_velocity_y
            - mayi_right_imu_angular_velocity_z
          args:
            data_type: imu
            imu_side: pika_r
            field_name: angular_velocity
            subfields: [x, y, z]
        - names:
            - mayi_right_imu_linear_acceleration_x
            - mayi_right_imu_linear_acceleration_y
            - mayi_right_imu_linear_acceleration_z
          args:
            data_type: imu
            imu_side: pika_r
            field_name: linear_acceleration
            subfields: [x, y, z]
        - names:
            - mayi_right_imu_orientation_w
            - mayi_right_imu_orientation_x
            - mayi_right_imu_orientation_y
            - mayi_right_imu_orientation_z
          args:
            data_type: imu
            imu_side: pika_r
            field_name: orientation
            subfields: [w, x, y, z]
        
        # 左手位姿 (6个维度: x, y, z, roll, pitch, yaw)
        - names:
            - mayi_left_pose_x
            - mayi_left_pose_y
            - mayi_left_pose_z
            - mayi_left_pose_roll
            - mayi_left_pose_pitch
            - mayi_left_pose_yaw
          args:
            data_type: localization
            localization_side: pika_l
            field_names: [x, y, z, roll, pitch, yaw]
        
        # 右手位姿 (6个维度)
        - names:
            - mayi_right_pose_x
            - mayi_right_pose_y
            - mayi_right_pose_z
            - mayi_right_pose_roll
            - mayi_right_pose_pitch
            - mayi_right_pose_yaw
          args:
            data_type: localization
            localization_side: pika_r
            field_names: [x, y, z, roll, pitch, yaw]

  action:
    timeline_offset: 1
    sub_action:
      # Action 使用相同的数据（因为没有master-puppet区分）
      # 左夹爪
      - names:
          - mayi_left_gripper_angle
        args:
          data_type: gripper
          gripper_side: pika_l
          field_name: angle
      - names:
          - mayi_left_gripper_distance
        args:
          data_type: gripper
          gripper_side: pika_l
          field_name: distance
      
      # 右夹爪
      - names:
          - mayi_right_gripper_angle
        args:
          data_type: gripper
          gripper_side: pika_r
          field_name: angle
      - names:
          - mayi_right_gripper_distance
        args:
          data_type: gripper
          gripper_side: pika_r
          field_name: distance
      
      # 左手 IMU
      - names:
          - mayi_left_imu_angular_velocity_x
          - mayi_left_imu_angular_velocity_y
          - mayi_left_imu_angular_velocity_z
        args:
          data_type: imu
          imu_side: pika_l
          field_name: angular_velocity
          subfields: [x, y, z]
      - names:
          - mayi_left_imu_linear_acceleration_x
          - mayi_left_imu_linear_acceleration_y
          - mayi_left_imu_linear_acceleration_z
        args:
          data_type: imu
          imu_side: pika_l
          field_name: linear_acceleration
          subfields: [x, y, z]
      - names:
          - mayi_left_imu_orientation_w
          - mayi_left_imu_orientation_x
          - mayi_left_imu_orientation_y
          - mayi_left_imu_orientation_z
        args:
          data_type: imu
          imu_side: pika_l
          field_name: orientation
          subfields: [w, x, y, z]
      
      # 右手 IMU
      - names:
          - mayi_right_imu_angular_velocity_x
          - mayi_right_imu_angular_velocity_y
          - mayi_right_imu_angular_velocity_z
        args:
          data_type: imu
          imu_side: pika_r
          field_name: angular_velocity
          subfields: [x, y, z]
      - names:
          - mayi_right_imu_linear_acceleration_x
          - mayi_right_imu_linear_acceleration_y
          - mayi_right_imu_linear_acceleration_z
        args:
          data_type: imu
          imu_side: pika_r
          field_name: linear_acceleration
          subfields: [x, y, z]
      - names:
          - mayi_right_imu_orientation_w
          - mayi_right_imu_orientation_x
          - mayi_right_imu_orientation_y
          - mayi_right_imu_orientation_z
        args:
          data_type: imu
          imu_side: pika_r
          field_name: orientation
          subfields: [w, x, y, z]
      
      # 左手位姿
      - names:
          - mayi_left_pose_x
          - mayi_left_pose_y
          - mayi_left_pose_z
          - mayi_left_pose_roll
          - mayi_left_pose_pitch
          - mayi_left_pose_yaw
        args:
          data_type: localization
          localization_side: pika_l
          field_names: [x, y, z, roll, pitch, yaw]
      
      # 右手位姿
      - names:
          - mayi_right_pose_x
          - mayi_right_pose_y
          - mayi_right_pose_z
          - mayi_right_pose_roll
          - mayi_right_pose_pitch
          - mayi_right_pose_yaw
        args:
          data_type: localization
          localization_side: pika_r
          field_names: [x, y, z, roll, pitch, yaw]
