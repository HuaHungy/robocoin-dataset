          range_from: 0
          range_to: 4
          array_index: 0
        
        convert_func: quat_xyzw_2_euler_xyz
        ### values by manual
        convert_func: to_float32


      ### values by manual
      - names: 
        - right_end_pos_x_m
        - right_end_pos_y_m
        - right_end_pos_z_m

        args:
        args:
          h5_path: /action/end/position
          range_from: 0
          range_to: 3
          array_index: 1

        ### values by manual
        convert_func: to_float32

      ### values by manual
      - names: 
        - right_end_quat_x
        - right_end_quat_y
        - right_end_quat_z
        - right_end_quat_w
        args:
          ### keys and values by manual
          h5_path: /action/end/orientation
          range_from: 0
          range_to: 4
          array_index: 1

        convert_func: quat_xyzw_2_euler_xyz
        ### values by manual
        convert_func: to_float32

      - names: 
        - waist_yaw_rad
        - waist_pitch_rad

        args:
        args:
          h5_path: /action/waist/position
          range_from: 0
          range_to: 2
        
        ### values by manual
        convert_func: to_float32

      - names: 
        - head_yaw_rad
        - head_pitch_rad

        args:
        args:
          h5_path: /action/head/position
          range_from: 0
          range_to: 2
        
        ### values by manual
        convert_func: to_float32

      - names: 
        - left_effector_open_deg
        - right_effector_open_deg

        args:
          ### keys and values by manual
          h5_path: /action/effector/position
          range_from: 0
          range_to: 2
        
        convert_func: degree2rad
        ### values by manual
        convert_func: to_float32