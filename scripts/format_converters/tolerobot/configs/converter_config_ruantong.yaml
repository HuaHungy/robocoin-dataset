### fps by manual
fps: 30
features:
  observation:
    images:

    ### values by manual
    - cam_name: head_color
      args:
      args:
        ### key and values by manual
        h5_path: camera/{frame_idx}/head_color.jpg
        file_type: jpg


      ### values by function
      # dtype: video
      # shape: [480, 640, 3]
      # names: [height, width, channels]
      # lerobot_feature: observations.images.head_color : by _gen_lerobot_features()
        

    # ### values by manual
    # - cam_name: head_depth  # LeRobot不支持depth，已注释
    #   args:
    #     ### keys and values by manual
    #     h5_path: camera/{frame_idx}/head_depth.png
    #     file_type: png
    #   ### values by function
    #   # dtype: video
    #   # shape: [480, 640, 3]
    #   # names: [height, width, channels]
    #   # lerobot_feature: observations.images.head_depth : by _gen_lerobot_features()

    ### values by manual
    - cam_name: hand_left_color
      args:
      args:
