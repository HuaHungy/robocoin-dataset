### fps by manual
fps: 30
features:
  observation:
    images:

    ### values by manual
    - cam_name: cam_high_rgb
      args:

        ### keys and values by manual
        cam_name: cam_high_rgb
        mcap_topic: /camera_head/color/image_raw/compressed

      ### values by function
      # dtype: video
      # shape: [480, 640, 3]
      # names: [height, width, channels]
      # lerobot_feature: observations.images.cam_high_rgb : by _gen_lerobot_features()


    ### values by manual
    - cam_name: cam_left_wrist_rgb
      args:

        ### keys and values by manual
        cam_name: cam_left_wrist_rgb
        mcap_topic: /camera_left/color/image_raw/compressed

      ### values by function
      # dtype: video
      # shape: [480, 640, 3]
      # names: [height, width, channels]
      # lerobot_feature: observations.images.cam_left_wrist_rgb : by _gen_lerobot_features()


    ### values by manual
    - cam_name: cam_right_wrist_rgb
      args:

        ### keys and values by manual
        cam_name: cam_right_wrist_rgb
        mcap_topic: /camera_right/color/image_raw/compressed

      ### values by function
      # dtype: video
      # shape: [480, 640, 3]
      # names: [height, width, channels]
      # lerobot_feature: observations.images.cam_right_wrist_rgb : by _gen_lerobot_features()


    state:
      ### values by function
      # lerobot_feature: observation.state : by _gen_lerobot_features()
      # dtype: float32 
      # shape: [57]  # (左臂28 + 右臂28 + 升降1)
      
      ## sub_states should be concatenated together here : by _gen_state_names()
      sub_state:
      - names: 
          - left_arm_joint_1_rad
          - left_arm_joint_2_rad
          - left_arm_joint_3_rad
          - left_arm_joint_4_rad
          - left_arm_joint_5_rad
          - left_arm_joint_6_rad
          - left_arm_joint_7_rad
        args:
          mcap_topic: /left_arm_controller/joint_states
          range_from: 0
          range_to: 7
        convert_func: degree2rad
      
      - names: 
          - left_gripper_open_m
        args:
          mcap_topic: /left_arm_controller/rm_driver/gripper_pos
          range_from: 0
          range_to: 1
        convert_func: mm2m
      
      - names: 
          - left_eef_pos_x_m
          - left_eef_pos_y_m
          - left_eef_pos_z_m
        args:
          mcap_topic: /left_arm_controller/rm_driver/udp_arm_position
          range_from: 0
          range_to: 3
        convert_func: mm2m
      
      - names: 
          - left_eef_quat_w
          - left_eef_quat_x
          - left_eef_quat_y
          - left_eef_quat_z
        args:
          mcap_topic: /left_arm_controller/rm_driver/udp_arm_position
          range_from: 3
          range_to: 7
        convert_func: quat_xyzw_to_wxyz
      
      - names: 
          - left_six_force_fx
          - left_six_force_fy
          - left_six_force_fz
          - left_six_force_mx
          - left_six_force_my
          - left_six_force_mz
        args:
          mcap_topic: /left_arm_controller/rm_driver/udp_six_force
          range_from: 0
          range_to: 6
      
      - names:
          - left_joint_speed_1_rad_s
          - left_joint_speed_2_rad_s
          - left_joint_speed_3_rad_s
          - left_joint_speed_4_rad_s
          - left_joint_speed_5_rad_s
          - left_joint_speed_6_rad_s
          - left_joint_speed_7_rad_s
        args:
          mcap_topic: /left_arm_controller/rm_driver/udp_joint_speed
          range_from: 0
          range_to: 7
      
      - names: 
          - right_arm_joint_1_rad
          - right_arm_joint_2_rad
          - right_arm_joint_3_rad
          - right_arm_joint_4_rad
          - right_arm_joint_5_rad
          - right_arm_joint_6_rad
          - right_arm_joint_7_rad
        args:
          mcap_topic: /right_arm_controller/joint_states
          range_from: 0
          range_to: 7
        convert_func: degree2rad
      
      - names: 
          - right_gripper_open_m
        args:
          mcap_topic: /right_arm_controller/rm_driver/gripper_pos
          range_from: 0
          range_to: 1
        convert_func: mm2m
      
      - names: 
          - right_eef_pos_x_m
          - right_eef_pos_y_m
          - right_eef_pos_z_m
        args:
          mcap_topic: /right_arm_controller/rm_driver/udp_arm_position
          range_from: 0
          range_to: 3
        convert_func: mm2m
      
      - names: 
          - right_eef_quat_w
          - right_eef_quat_x
          - right_eef_quat_y
          - right_eef_quat_z
        args:
          mcap_topic: /right_arm_controller/rm_driver/udp_arm_position
          range_from: 3
          range_to: 7
        convert_func: quat_xyzw_to_wxyz
      
      - names: 
          - right_six_force_fx
          - right_six_force_fy
          - right_six_force_fz
          - right_six_force_mx
          - right_six_force_my
          - right_six_force_mz
        args:
          mcap_topic: /right_arm_controller/rm_driver/udp_six_force
          range_from: 0
          range_to: 6
      
      - names:
          - right_joint_speed_1_rad_s
          - right_joint_speed_2_rad_s
          - right_joint_speed_3_rad_s
          - right_joint_speed_4_rad_s
          - right_joint_speed_5_rad_s
          - right_joint_speed_6_rad_s
          - right_joint_speed_7_rad_s
        args:
          mcap_topic: /right_arm_controller/rm_driver/udp_joint_speed
          range_from: 0
          range_to: 7
      
      - names:
          - lift_position_m
        args:
          mcap_topic: /right_arm_controller/rm_driver/udp_lift_pos
          range_from: 0
          range_to: 1
        convert_func: mm2m


  action:
    ### values by function
    # lerobot_feature: action : by _gen_lerobot_features()
    # dtype: float32
    # shape: [26]  # 不包含六维力（action不需要force sensor）

    ## sub_actions should be concatenated together here : by _gen_action_names(), such as:
    # names: 
    # - right_arm_joint_1_rad
    # - ...
    # - right_arm_joint_7_rad
    # - ...


    ### values by manual
    timeline_offset: 1
    sub_action:
      - names: 
          - right_arm_joint_1_rad
          - right_arm_joint_2_rad
          - right_arm_joint_3_rad
          - right_arm_joint_4_rad
          - right_arm_joint_5_rad
          - right_arm_joint_6_rad
          - right_arm_joint_7_rad
        args:

          ### keys and values by manual
          mcap_topic: /right_arm_controller/joint_states
          range_from: 0
          range_to: 7

        ### values by manual
        # convert_func: degree2rad


      ### values by manual
      - names: 
          - right_gripper_open_rad
        args:

          ### keys and values by manual
          mcap_topic: /right_arm_controller/rm_driver/gripper_pos
          range_from: 0
          range_to: 1

        ### values by manual
        # convert_func: degree2rad


      ### values by manual
      - names: 
          - right_eef_pos_x_m
          - right_eef_pos_y_m
          - right_eef_pos_z_m
        args:

          ### keys and values by manual
          mcap_topic: /right_arm_controller/rm_driver/udp_arm_position
          range_from: 0
          range_to: 3


      ### values by manual
      - names: 
          - right_eef_rot_euler_x_rad
          - right_eef_rot_euler_y_rad
          - right_eef_rot_euler_z_rad
        args:

          ### keys and values by manual
          mcap_topic: /right_arm_controller/rm_driver/udp_arm_position
          range_from: 3
          range_to: 7

        ### values by manual
        convert_func: quat_xyzw_2_euler_xyz


      ### values by manual
      - names: 
          - left_arm_joint_1_rad
          - left_arm_joint_2_rad
          - left_arm_joint_3_rad
          - left_arm_joint_4_rad
          - left_arm_joint_5_rad
          - left_arm_joint_6_rad
          - left_arm_joint_7_rad
        args:

          ### keys and values by manual
          mcap_topic: /left_arm_controller/joint_states
          range_from: 0
          range_to: 7

        ### values by manual
        # convert_func: degree2rad


      ### values by manual
      - names: 
          - left_gripper_open_rad
        args:

          ### keys and values by manual
          mcap_topic: /left_arm_controller/rm_driver/gripper_pos
          range_from: 0
          range_to: 1

        ### values by manual
        # convert_func: degree2rad
        
        # ⚠️ 数据质量注意：某些episode中此字段可能为常量（例如GroceryStore_Restrocking_Fallen中恒为0.907）
        # 这表明该episode中左臂未被使用，但字段仍保留以保持数据一致性


      ### values by manual
      - names: 
          - left_eef_pos_x_m
          - left_eef_pos_y_m
          - left_eef_pos_z_m
        args:

          ### keys and values by manual
          mcap_topic: /left_arm_controller/rm_driver/udp_arm_position
          range_from: 0
          range_to: 3


      ### values by manual
      - names: 
          - left_eef_rot_euler_x_rad
          - left_eef_rot_euler_y_rad
          - left_eef_rot_euler_z_rad
        args:

          ### keys and values by manual
          mcap_topic: /left_arm_controller/rm_driver/udp_arm_position
          range_from: 3
          range_to: 7

        ### values by manual
        convert_func: quat_xyzw_2_euler_xyz
