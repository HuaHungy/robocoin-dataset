### Galaxea R1 Lite - H5 版本
### 新版本数据格式：只有 H5 文件，没有图像
### 
### 数据结构：
### - state_qpos (14): [0-6] 左臂关节 + [7-13] 右臂关节
### - state_eepose (20): [0-9] 左臂末端执行器 + [10-19] 右臂末端执行器
### - action_qpos (14): 同 state_qpos
### - action_eepose (20): 同 state_eepose

### fps by manual
fps: 30

features:
  observation:
    # 注意：此版本没有图像数据
    # images: []

    state:
      ### State 定义
      ### shape: [34] = 14 qpos + 20 eepose
      ### 数据结构：
      ### - qpos (14): [0-6] 左臂7个关节 + [7-13] 右臂7个关节
      ### - eepose (20): [0-9] 左臂末端执行器10维 + [10-19] 右臂末端执行器10维
      
      sub_state:
        ### Joint positions (14) - 左臂7个 + 右臂7个
        - names: 
            - left_arm_qpos_0
            - left_arm_qpos_1
            - left_arm_qpos_2
            - left_arm_qpos_3
            - left_arm_qpos_4
            - left_arm_qpos_5
            - left_arm_qpos_6
            - right_arm_qpos_0
            - right_arm_qpos_1
            - right_arm_qpos_2
            - right_arm_qpos_3
            - right_arm_qpos_4
            - right_arm_qpos_5
            - right_arm_qpos_6
          args:
            h5_path: state_qpos
            range_from: 0
            range_to: 14
          convert_func: to_float32

        ### End-effector pose (20) - 左臂10个 + 右臂10个
        - names:
            - left_ee_pose_0
            - left_ee_pose_1
            - left_ee_pose_2
            - left_ee_pose_3
            - left_ee_pose_4
            - left_ee_pose_5
            - left_ee_pose_6
            - left_ee_pose_7
            - left_ee_pose_8
            - left_ee_pose_9
            - right_ee_pose_0
            - right_ee_pose_1
            - right_ee_pose_2
            - right_ee_pose_3
            - right_ee_pose_4
            - right_ee_pose_5
            - right_ee_pose_6
            - right_ee_pose_7
            - right_ee_pose_8
            - right_ee_pose_9
          args:
            h5_path: state_eepose
            range_from: 0
            range_to: 20
          convert_func: to_float32

  action:
    ### Action 定义
    ### shape: [34] = 14 qpos + 20 eepose (与 state 相同)
    
    timeline_offset: 1
    
    sub_action:
      ### Joint positions (14) - 左臂7个 + 右臂7个
      - names: 
          - left_arm_qpos_0
          - left_arm_qpos_1
          - left_arm_qpos_2
          - left_arm_qpos_3
          - left_arm_qpos_4
          - left_arm_qpos_5
          - left_arm_qpos_6
          - right_arm_qpos_0
          - right_arm_qpos_1
          - right_arm_qpos_2
          - right_arm_qpos_3
          - right_arm_qpos_4
          - right_arm_qpos_5
          - right_arm_qpos_6
        args:
          h5_path: action_qpos
          range_from: 0
          range_to: 14
        convert_func: to_float32

      ### End-effector pose (20) - 左臂10个 + 右臂10个
      - names:
          - left_ee_pose_0
          - left_ee_pose_1
          - left_ee_pose_2
          - left_ee_pose_3
          - left_ee_pose_4
          - left_ee_pose_5
          - left_ee_pose_6
          - left_ee_pose_7
          - left_ee_pose_8
          - left_ee_pose_9
          - right_ee_pose_0
          - right_ee_pose_1
          - right_ee_pose_2
          - right_ee_pose_3
          - right_ee_pose_4
          - right_ee_pose_5
          - right_ee_pose_6
          - right_ee_pose_7
          - right_ee_pose_8
          - right_ee_pose_9
        args:
          h5_path: action_eepose
          range_from: 0
          range_to: 20
        convert_func: to_float32
