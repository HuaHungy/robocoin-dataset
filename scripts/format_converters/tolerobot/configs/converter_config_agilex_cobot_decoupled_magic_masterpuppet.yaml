fps: 30
features:
  observation:
    images:
      - cam_name: cam_front_rgb
        args:
          h5_path: images/cam_front
      - cam_name: cam_high_rgb
        args:
          h5_path: images/cam_high
      - cam_name: cam_left_wrist_rgb
        args:
          h5_path: images/cam_left_wrist
      - cam_name: cam_right_wrist_rgb
        args:
          h5_path: images/cam_right_wrist

    state:
      # 总维度: 12 (master joints) + 2 (master grippers) + 12 (puppet joints) + 2 (puppet grippers) 
      #         + 7 (puppet_eef_pose) + 2 (puppet_gripper_effort) + 12 (puppet_velocity) = 49
      sub_state:
        # master左臂关节 (6维，不含gripper)
        - names:
            - master_left_arm_joint_1_rad
            - master_left_arm_joint_2_rad
            - master_left_arm_joint_3_rad
            - master_left_arm_joint_4_rad
            - master_left_arm_joint_5_rad
            - master_left_arm_joint_6_rad
          args:
            h5_path: master/joint
            range_from: 0
            range_to: 6
            
        # master左臂gripper (1维，从joint第7维独立出来)
        - names:
            - master_left_gripper_open_rad  # 范围: [-0.0003, 0.074] rad ≈ 4.24°
          args:
            h5_path: master/joint
            range_from: 6
            range_to: 7
            
        # master右臂关节 (6维，不含gripper)
        - names:
            - master_right_arm_joint_1_rad
            - master_right_arm_joint_2_rad
            - master_right_arm_joint_3_rad
            - master_right_arm_joint_4_rad
            - master_right_arm_joint_5_rad
            - master_right_arm_joint_6_rad
          args:
            h5_path: master/joint
            range_from: 7
            range_to: 13
            
        # master右臂gripper (1维，从joint第14维独立出来)
        - names:
            - master_right_gripper_open_rad  # 范围: [0, 0.072] rad ≈ 4.13°
          args:
            h5_path: master/joint
            range_from: 13
            range_to: 14
            
        # puppet左臂关节 (6维，不含gripper)
        - names:
            - puppet_left_arm_joint_1_rad
            - puppet_left_arm_joint_2_rad
            - puppet_left_arm_joint_3_rad
            - puppet_left_arm_joint_4_rad
            - puppet_left_arm_joint_5_rad
            - puppet_left_arm_joint_6_rad
          args:
            h5_path: puppet/joint
            range_from: 0
            range_to: 6
            
        # puppet左臂gripper (1维，从joint第7维独立出来)
        - names:
            - puppet_left_gripper_open_rad  # 范围: [-0.0003, 0.069] rad ≈ 3.95°
          args:
            h5_path: puppet/joint
            range_from: 6
            range_to: 7
            
        # puppet右臂关节 (6维，不含gripper)
        - names:
            - puppet_right_arm_joint_1_rad
            - puppet_right_arm_joint_2_rad
            - puppet_right_arm_joint_3_rad
            - puppet_right_arm_joint_4_rad
            - puppet_right_arm_joint_5_rad
            - puppet_right_arm_joint_6_rad
          args:
            h5_path: puppet/joint
            range_from: 7
            range_to: 13
            
        # puppet右臂gripper (1维，从joint第14维独立出来)
        - names:
            - puppet_right_gripper_open_rad  # 范围: [0, 0.068] rad ≈ 3.90°
          args:
            h5_path: puppet/joint
            range_from: 13
            range_to: 14

        # puppet左臂末端位姿 (7维，包含位置和姿态)

        # Left臂末端执行器位置 (3维)
        - names:
          - puppet_left_eef_pos_x_m
          - puppet_left_eef_pos_y_m
          - puppet_left_eef_pos_z_m
        args:
          h5_path: puppet/eef_pose
          range_from: 0
          range_to: 3

        # Left臂末端执行器姿态 (四元数→欧拉角)
        - names:
          - puppet_left_eef_rot_euler_x_rad
          - puppet_left_eef_rot_euler_y_rad
          - puppet_left_eef_rot_euler_z_rad
        args:
          h5_path: puppet/eef_pose
          range_from: 3
          range_to: 7
        convert_func: quat_xyzw_2_euler_xyz
        # puppet右臂末端位姿 (7维，虽然是常量但保留)

        # Right臂末端执行器位置 (3维)
        - names:
          - puppet_right_eef_pos_x_m
          - puppet_right_eef_pos_y_m
          - puppet_right_eef_pos_z_m
        args:
          h5_path: puppet/eef_pose
          range_from: 7
          range_to: 10

        # Right臂末端执行器姿态 (四元数→欧拉角)
        - names:
          - puppet_right_eef_rot_euler_x_rad
          - puppet_right_eef_rot_euler_y_rad
          - puppet_right_eef_rot_euler_z_rad
        args:
          h5_path: puppet/eef_pose
          range_from: 10
          range_to: 14
        convert_func: quat_xyzw_2_euler_xyz
        # puppet左臂gripper力矩 (1维)
        - names:
            - puppet_left_gripper_eff_nm  # 范围: [-1.31, 0.31] N·m
          args:
            h5_path: puppet/effort
            range_from: 6
            range_to: 7
            
        # puppet右臂gripper力矩 (1维)
        - names:
            - puppet_right_gripper_eff_nm  # 范围: [-1.83, 0.35] N·m
          args:
            h5_path: puppet/effort
            range_from: 13
            range_to: 14

        # puppet左臂速度 (前6个关节，gripper速度为零已排除)
        - names:
            - puppet_left_arm_joint_1_vel_rad_s
            - puppet_left_arm_joint_2_vel_rad_s
            - puppet_left_arm_joint_3_vel_rad_s
            - puppet_left_arm_joint_4_vel_rad_s
            - puppet_left_arm_joint_5_vel_rad_s
            - puppet_left_arm_joint_6_vel_rad_s
          args:
            h5_path: puppet/velocity
            range_from: 0
            range_to: 6
            
        # puppet右臂速度 (前6个关节，gripper速度为零已排除)
        - names:
            - puppet_right_arm_joint_1_vel_rad_s
            - puppet_right_arm_joint_2_vel_rad_s
            - puppet_right_arm_joint_3_vel_rad_s
            - puppet_right_arm_joint_4_vel_rad_s
            - puppet_right_arm_joint_5_vel_rad_s
            - puppet_right_arm_joint_6_vel_rad_s
          args:
            h5_path: puppet/velocity
            range_from: 7
            range_to: 13

        # 注意：以下字段已移除（全零或无意义）
        # - base/velocity (全零)
        # - compress_len/ (无意义数据)
        # - depths/ (全零)
        # - puppet/eef_pose [7-13] (右臂末端全常量)
        # - puppet/effort [0-5, 7-12] (前6关节effort全零)
        # - puppet/velocity [6, 13] (gripper速度全零)

  action:
    timeline_offset: 1
    sub_action:
      # master左臂关节动作 (6维，不含gripper)
      - names:
          - master_left_arm_joint_1_rad
          - master_left_arm_joint_2_rad
          - master_left_arm_joint_3_rad
          - master_left_arm_joint_4_rad
          - master_left_arm_joint_5_rad
          - master_left_arm_joint_6_rad
        args:
          h5_path: master/joint
          range_from: 0
          range_to: 6
          
      # master左臂gripper动作 (1维)
      - names:
          - master_left_gripper_open_rad
        args:
          h5_path: master/joint
          range_from: 6
          range_to: 7
          
      # master右臂关节动作 (6维，不含gripper)
      - names:
          - master_right_arm_joint_1_rad
          - master_right_arm_joint_2_rad
          - master_right_arm_joint_3_rad
          - master_right_arm_joint_4_rad
          - master_right_arm_joint_5_rad
          - master_right_arm_joint_6_rad
        args:
          h5_path: master/joint
          range_from: 7
          range_to: 13
          
      # master右臂gripper动作 (1维)
      - names:
          - master_right_gripper_open_rad
        args:
          h5_path: master/joint
          range_from: 13
          range_to: 14
          
      # puppet左臂关节 (6维，不含gripper)
      - names:
          - puppet_left_arm_joint_1_rad
          - puppet_left_arm_joint_2_rad
          - puppet_left_arm_joint_3_rad
          - puppet_left_arm_joint_4_rad
          - puppet_left_arm_joint_5_rad
          - puppet_left_arm_joint_6_rad
        args:
          h5_path: puppet/joint
          range_from: 0
          range_to: 6
          
      # puppet左臂gripper (1维)
      - names:
          - puppet_left_gripper_open_rad
        args:
          h5_path: puppet/joint
          range_from: 6
          range_to: 7
          
      # puppet右臂关节 (6维，不含gripper)
      - names:
          - puppet_right_arm_joint_1_rad
          - puppet_right_arm_joint_2_rad
          - puppet_right_arm_joint_3_rad
          - puppet_right_arm_joint_4_rad
          - puppet_right_arm_joint_5_rad
          - puppet_right_arm_joint_6_rad
        args:
          h5_path: puppet/joint
          range_from: 7
          range_to: 13
          
      # puppet右臂gripper (1维)
      - names:
          - puppet_right_gripper_open_rad
        args:
          h5_path: puppet/joint
          range_from: 13
          range_to: 14

      # puppet左臂末端位姿 (7维)

      # Left臂末端执行器位置 (3维)
      - names:
        - puppet_left_eef_pos_x_m
        - puppet_left_eef_pos_y_m
        - puppet_left_eef_pos_z_m
      args:
        h5_path: puppet/eef_pose
        range_from: 0
        range_to: 3

      # Left臂末端执行器姿态 (四元数→欧拉角)
      - names:
        - puppet_left_eef_rot_euler_x_rad
        - puppet_left_eef_rot_euler_y_rad
        - puppet_left_eef_rot_euler_z_rad
      args:
        h5_path: puppet/eef_pose
        range_from: 3
        range_to: 7
      convert_func: quat_xyzw_2_euler_xyz
      # puppet右臂末端位姿 (7维)

      # Right臂末端执行器位置 (3维)
      - names:
        - puppet_right_eef_pos_x_m
        - puppet_right_eef_pos_y_m
        - puppet_right_eef_pos_z_m
      args:
        h5_path: puppet/eef_pose
        range_from: 7
        range_to: 10

      # Right臂末端执行器姿态 (四元数→欧拉角)
      - names:
        - puppet_right_eef_rot_euler_x_rad
        - puppet_right_eef_rot_euler_y_rad
        - puppet_right_eef_rot_euler_z_rad
      args:
        h5_path: puppet/eef_pose
        range_from: 10
        range_to: 14
      convert_func: quat_xyzw_2_euler_xyz
      # puppet左臂gripper力矩 (1维)
      - names:
          - puppet_left_gripper_eff_nm
        args:
          h5_path: puppet/effort
          range_from: 6
          range_to: 7
          
      # puppet右臂gripper力矩 (1维)
      - names:
          - puppet_right_gripper_eff_nm
        args:
          h5_path: puppet/effort
          range_from: 13
          range_to: 14

      # puppet左臂速度 (前6个关节)
      - names:
          - puppet_left_arm_joint_1_vel_rad_s
          - puppet_left_arm_joint_2_vel_rad_s
          - puppet_left_arm_joint_3_vel_rad_s
          - puppet_left_arm_joint_4_vel_rad_s
          - puppet_left_arm_joint_5_vel_rad_s
          - puppet_left_arm_joint_6_vel_rad_s
        args:
          h5_path: puppet/velocity
          range_from: 0
          range_to: 6
          
      # puppet右臂速度 (前6个关节)
      - names:
          - puppet_right_arm_joint_1_vel_rad_s
          - puppet_right_arm_joint_2_vel_rad_s
          - puppet_right_arm_joint_3_vel_rad_s
          - puppet_right_arm_joint_4_vel_rad_s
          - puppet_right_arm_joint_5_vel_rad_s
          - puppet_right_arm_joint_6_vel_rad_s
        args:
          h5_path: puppet/velocity
          range_from: 7
          range_to: 13
