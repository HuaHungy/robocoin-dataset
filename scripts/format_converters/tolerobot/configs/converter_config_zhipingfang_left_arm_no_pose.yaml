### 智平方数据集配置 - 左臂单臂版本（不包含 arm pose）
### 
### 使用场景：单左臂操作，右臂数据为空，左臂 pose 数据为空
### - observations/camera/rgb/head/images: ✅ 有数据
### - observations/camera/rgb/left/images: ✅ 有数据
### - observations/camera/rgb/right/images: ❌ 空
### - observations/camera/rgb/chest/images: ❌ 空
### - observations/arm/left/joints: ✅ 有数据
### - observations/arm/left/pose: ❌ 空
### - observations/arm/left/wrench: ✅ 有数据
### - observations/arm/right/*: ❌ 空

fps: 30

features:
  observation:
    images:
      ### 左臂相机：head + left wrist
      - cam_name: camera_head_rgb
        args:
          h5_path: observations/camera/rgb/head/images

      - cam_name: camera_left_wrist_rgb
        args:
          h5_path: observations/camera/rgb/left/images

    state:
      ### State: 15D = 7 left joints + 6 left wrench + 1 left gripper + 1 timestamp
      
      sub_state:
        ### Left arm joints (7)
        - names:
            - left_arm_joint_0
            - left_arm_joint_1
            - left_arm_joint_2
            - left_arm_joint_3
            - left_arm_joint_4
            - left_arm_joint_5
            - left_arm_joint_6
          args:
            h5_path: observations/arm/left/joints
            range_from: 0
            range_to: 7
          convert_func: to_float32

        ### Left arm wrench (6) - force xyz + torque xyz
        - names:
            - left_arm_wrench_fx
            - left_arm_wrench_fy
            - left_arm_wrench_fz
            - left_arm_wrench_tx
            - left_arm_wrench_ty
            - left_arm_wrench_tz
          args:
            h5_path: observations/arm/left/wrench
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Left gripper position (1)
        - names:
            - left_effector_position
          args:
            h5_path: observations/effector/left/position
            range_from: 0
            range_to: 1
          convert_func: to_float32

        ### Timestamp (1) - filler to match dimensions
        - names:
            - timestamp_normalized
          args:
            h5_path: observations/timestamp
            range_from: 0
            range_to: 1
          convert_func: to_float32

  action:
    ### Action: 14D = 7 left joints + 6 left wrench + 1 left gripper
    ### 使用 timeline_offset: 1 从下一帧获取 action
    
    timeline_offset: 1
    
    sub_action:
      ### Left arm joints (7)
      - names:
          - left_arm_joint_0
          - left_arm_joint_1
          - left_arm_joint_2
          - left_arm_joint_3
          - left_arm_joint_4
          - left_arm_joint_5
          - left_arm_joint_6
        args:
          h5_path: observations/arm/left/joints
          range_from: 0
          range_to: 7
        convert_func: to_float32

      ### Left arm wrench (6)
      - names:
          - left_arm_wrench_fx
          - left_arm_wrench_fy
          - left_arm_wrench_fz
          - left_arm_wrench_tx
          - left_arm_wrench_ty
          - left_arm_wrench_tz
        args:
          h5_path: observations/arm/left/wrench
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Left gripper (1)
      - names:
          - left_effector_position
        args:
          h5_path: observations/effector/left/position
          range_from: 0
          range_to: 1
        convert_func: to_float32
