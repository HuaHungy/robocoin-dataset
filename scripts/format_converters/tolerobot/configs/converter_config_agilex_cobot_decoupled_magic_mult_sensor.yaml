fps: 50
features:
  observation:
    images:
      # 3个 RGB 相机
      - cam_name: camera_front_rgb
        args:
          cam_name: camera_front_rgb
          camera_folder: front
      - cam_name: camera_left_rgb
        args:
          cam_name: camera_left_rgb
          camera_folder: left
      - cam_name: camera_right_rgb
        args:
          cam_name: camera_right_rgb
          camera_folder: right
      
      # 3个深度相机（LeRobot不支持depth，已注释）
      # - cam_name: camera_front_depth
      #   args:
      #     cam_name: camera_front_depth
      #     camera_folder: front
      #     is_depth: true
      # - cam_name: camera_left_depth
      #   args:
      #     cam_name: camera_left_depth
      #     camera_folder: left
      #     is_depth: true
      # - cam_name: camera_right_depth
      #   args:
      #     cam_name: camera_right_depth
      #     camera_folder: right
      #     is_depth: true

    state:
      # 总维度: 6+1 (puppet_left) + 6+1 (puppet_right) + 6 (left_eef) + 6 (right_eef) = 26
      sub_state:
        # puppet左臂关节 (6维，不含gripper) - position[0:6]
        - names:
            - puppet_left_arm_joint_1_rad
            - puppet_left_arm_joint_2_rad
            - puppet_left_arm_joint_3_rad
            - puppet_left_arm_joint_4_rad
            - puppet_left_arm_joint_5_rad
            - puppet_left_arm_joint_6_rad
          args:
            joint_type: puppetLeft
            field_name: position
            range_from: 0
            range_to: 6
        
        # puppet左臂gripper (1维) - position[6]
        - names:
            - puppet_left_gripper_open_rad  # 范围: [-0.00028, 0.00007] rad
          args:
            joint_type: puppetLeft
            field_name: position
            range_from: 6
            range_to: 7
        
        # puppet右臂关节 (6维，不含gripper) - position[0:6]
        - names:
            - puppet_right_arm_joint_1_rad
            - puppet_right_arm_joint_2_rad
            - puppet_right_arm_joint_3_rad
            - puppet_right_arm_joint_4_rad
            - puppet_right_arm_joint_5_rad
            - puppet_right_arm_joint_6_rad
          args:
            joint_type: puppetRight
            field_name: position
            range_from: 0
            range_to: 6
        
        # puppet右臂gripper (1维) - position[6]
        - names:
            - puppet_right_gripper_open_rad  # 范围: [-0.00042, 0.064] rad
          args:
            joint_type: puppetRight
            field_name: position
            range_from: 6
            range_to: 7
        
        # puppet左臂末端位置 (3维) - localization x, y, z
        - names:
            - puppet_left_eef_pos_x_m
            - puppet_left_eef_pos_y_m
            - puppet_left_eef_pos_z_m
          args:
            data_type: localization
            localization_side: puppetLeft
            field_names: [x, y, z]
            
        # puppet左臂末端姿态 (3维) - localization roll, pitch, yaw
        - names:
            - puppet_left_eef_rot_euler_roll_rad
            - puppet_left_eef_rot_euler_pitch_rad
            - puppet_left_eef_rot_euler_yaw_rad
          args:
            data_type: localization
            localization_side: puppetLeft
            field_names: [roll, pitch, yaw]
        
        # puppet右臂末端位置 (3维) - localization x, y, z
        - names:
            - puppet_right_eef_pos_x_m
            - puppet_right_eef_pos_y_m
            - puppet_right_eef_pos_z_m
          args:
            data_type: localization
            localization_side: puppetRight
            field_names: [x, y, z]
            
        # puppet右臂末端姿态 (3维) - localization roll, pitch, yaw
        - names:
            - puppet_right_eef_rot_euler_roll_rad
            - puppet_right_eef_rot_euler_pitch_rad
            - puppet_right_eef_rot_euler_yaw_rad
          args:
            data_type: localization
            localization_side: puppetRight
            field_names: [roll, pitch, yaw]

  action:
    timeline_offset: 1
    sub_action:
      # puppet左臂关节 (6维，使用 timeline_offset)
      - names:
          - puppet_left_arm_joint_1_rad
          - puppet_left_arm_joint_2_rad
          - puppet_left_arm_joint_3_rad
          - puppet_left_arm_joint_4_rad
          - puppet_left_arm_joint_5_rad
          - puppet_left_arm_joint_6_rad
        args:
          joint_type: puppetLeft
          field_name: position
          range_from: 0
          range_to: 6
      
      # puppet左臂gripper (1维)
      - names:
          - puppet_left_gripper_open_rad
        args:
          joint_type: puppetLeft
          field_name: position
          range_from: 6
          range_to: 7
      
      # puppet右臂关节 (6维)
      - names:
          - puppet_right_arm_joint_1_rad
          - puppet_right_arm_joint_2_rad
          - puppet_right_arm_joint_3_rad
          - puppet_right_arm_joint_4_rad
          - puppet_right_arm_joint_5_rad
          - puppet_right_arm_joint_6_rad
        args:
          joint_type: puppetRight
          field_name: position
          range_from: 0
          range_to: 6
      
      # puppet右臂gripper (1维)
      - names:
          - puppet_right_gripper_open_rad
        args:
          joint_type: puppetRight
          field_name: position
          range_from: 6
          range_to: 7
      
      # puppet左臂末端位置 (3维)
      - names:
          - puppet_left_eef_pos_x_m
          - puppet_left_eef_pos_y_m
          - puppet_left_eef_pos_z_m
        args:
          data_type: localization
          localization_side: puppetLeft
          field_names: [x, y, z]
          
      # puppet左臂末端姿态 (3维)
      - names:
          - puppet_left_eef_rot_euler_roll_rad
          - puppet_left_eef_rot_euler_pitch_rad
          - puppet_left_eef_rot_euler_yaw_rad
        args:
          data_type: localization
          localization_side: puppetLeft
          field_names: [roll, pitch, yaw]
      
      # puppet右臂末端位置 (3维)
      - names:
          - puppet_right_eef_pos_x_m
          - puppet_right_eef_pos_y_m
          - puppet_right_eef_pos_z_m
        args:
          data_type: localization
          localization_side: puppetRight
          field_names: [x, y, z]
          
      # puppet右臂末端姿态 (3维)
      - names:
          - puppet_right_eef_rot_euler_roll_rad
          - puppet_right_eef_rot_euler_pitch_rad
          - puppet_right_eef_rot_euler_yaw_rad
        args:
          data_type: localization
          localization_side: puppetRight
          field_names: [roll, pitch, yaw]
