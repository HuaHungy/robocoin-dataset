### 智平方数据集配置 - 右臂单臂版本（不包含 arm pose）
### 
### 使用场景：单右臂操作，左臂数据为空，右臂 pose 数据为空
### - observations/camera/rgb/head/images: ✅ 有数据
### - observations/camera/rgb/right/images: ✅ 有数据
### - observations/camera/rgb/left/images: ❌ 空
### - observations/camera/rgb/chest/images: ❌ 空
### - observations/arm/right/joints: ✅ 有数据
### - observations/arm/right/pose: ❌ 空
### - observations/arm/right/wrench: ✅ 有数据
### - observations/arm/left/*: ❌ 空

fps: 30

features:
  observation:
    images:
      ### 右臂相机：head + right wrist
      - cam_name: camera_head_rgb
        args:
          h5_path: observations/camera/rgb/head/images

      - cam_name: camera_right_wrist_rgb
        args:
          h5_path: observations/camera/rgb/right/images

    state:
      ### State: 15D = 7 right joints + 6 right wrench + 1 right gripper + 1 timestamp
      
      sub_state:
        ### Right arm joints (7)
        - names:
            - right_arm_joint_0
            - right_arm_joint_1
            - right_arm_joint_2
            - right_arm_joint_3
            - right_arm_joint_4
            - right_arm_joint_5
            - right_arm_joint_6
          args:
            h5_path: observations/arm/right/joints
            range_from: 0
            range_to: 7
          convert_func: to_float32

        ### Right arm wrench (6) - force xyz + torque xyz
        - names:
            - right_arm_wrench_fx
            - right_arm_wrench_fy
            - right_arm_wrench_fz
            - right_arm_wrench_tx
            - right_arm_wrench_ty
            - right_arm_wrench_tz
          args:
            h5_path: observations/arm/right/wrench
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Right gripper position (1)
        - names:
            - right_effector_position
          args:
            h5_path: observations/effector/right/position
            range_from: 0
            range_to: 1
          convert_func: to_float32

        ### Timestamp (1) - filler to match dimensions
        - names:
            - timestamp_normalized
          args:
            h5_path: observations/timestamp
            range_from: 0
            range_to: 1
          convert_func: to_float32

  action:
    ### Action: 14D = 7 right joints + 6 right wrench + 1 right gripper
    ### 使用 timeline_offset: 1 从下一帧获取 action
    
    timeline_offset: 1
    
    sub_action:
      ### Right arm joints (7)
      - names:
          - right_arm_joint_0
          - right_arm_joint_1
          - right_arm_joint_2
          - right_arm_joint_3
          - right_arm_joint_4
          - right_arm_joint_5
          - right_arm_joint_6
        args:
          h5_path: observations/arm/right/joints
          range_from: 0
          range_to: 7
        convert_func: to_float32

      ### Right arm wrench (6)
      - names:
          - right_arm_wrench_fx
          - right_arm_wrench_fy
          - right_arm_wrench_fz
          - right_arm_wrench_tx
          - right_arm_wrench_ty
          - right_arm_wrench_tz
        args:
          h5_path: observations/arm/right/wrench
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Right gripper (1)
      - names:
          - right_effector_position
        args:
          h5_path: observations/effector/right/position
          range_from: 0
          range_to: 1
        convert_func: to_float32
