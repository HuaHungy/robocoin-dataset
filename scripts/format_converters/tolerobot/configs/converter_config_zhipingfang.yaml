### fps by manual
fps: 30

features:
  observation:
    images:
      ### values by manual - RGB cameras with images
      - cam_name: camera_head_rgb
        args:
          ### keys and values by manual
          h5_path: observations/camera/rgb/head/images

        ### values by function
        # dtype: video
        # lerobot_feature: observations.images.camera_head_rgb : by _gen_lerobot_features()

      - cam_name: camera_right_wrist_rgb
        args:
          ### keys and values by manual
          h5_path: observations/camera/rgb/right/images

        ### values by function
        # dtype: video
        # lerobot_feature: observations.images.camera_right_rgb : by _gen_lerobot_features()

