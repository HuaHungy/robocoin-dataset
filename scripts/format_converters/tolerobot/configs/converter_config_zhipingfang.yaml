          range_from: 0
          range_to: 1
        ### Convert int64 to float32 as LeRobot requires float32
        convert_func: to_float32

      ### Right arm joints (7)
      - names:
          - right_arm_joint_0
          - right_arm_joint_1
          - right_arm_joint_2
          - right_arm_joint_3
          - right_arm_joint_4
          - right_arm_joint_5
          - right_arm_joint_6
        args:
          ### keys and values by manual
          h5_path: observations/arm/right/joints
          range_from: 0
          range_to: 7
        ### Convert float64 to float32 as LeRobot requires float32
        convert_func: to_float32

      ### Right arm end effector pose (6)
      - names:
          - right_arm_pose_x
          - right_arm_pose_y
          - right_arm_pose_z
          - right_arm_pose_roll
          - right_arm_pose_pitch
          - right_arm_pose_yaw
        args:
          ### keys and values by manual
          h5_path: observations/arm/right/pose
          range_from: 0
          range_to: 6
        ### Convert float64 to float32 as LeRobot requires float32
        convert_func: to_float32

      ### Right arm wrench (6)
      - names:
          - right_arm_wrench_fx
          - right_arm_wrench_fy
          - right_arm_wrench_fz
          - right_arm_wrench_tx
          - right_arm_wrench_ty
          - right_arm_wrench_tz
        args:
          ### keys and values by manual
          h5_path: observations/arm/right/wrench
          range_from: 0
          range_to: 6
        ### Convert float64 to float32 as LeRobot requires float32
        convert_func: to_float32

      ### Right gripper position (1)
      - names:
