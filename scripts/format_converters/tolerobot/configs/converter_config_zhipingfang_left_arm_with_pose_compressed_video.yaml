### 智平方数据集配置 - 左臂版本（包含 arm pose）- 压缩视频格式
### 
### 使用场景：单左臂操作，包含左臂 pose 数据，图像以压缩视频格式存储
### - observations/camera/rgb/head/video: ✅ 有数据（压缩视频）
### - observations/camera/rgb/left/video: ✅ 有数据（压缩视频）
### - observations/arm/left/joints: ✅ 有数据
### - observations/arm/left/pose: ✅ 有数据
### - observations/arm/left/wrench: ✅ 有数据

fps: 30

features:
  observation:
    images:
      ### 两相机配置 - 使用压缩视频格式
      - cam_name: camera_head_rgb
        args:
          h5_path: observations/camera/rgb/head/images
          use_compressed_video: true

      - cam_name: camera_left_wrist_rgb
        args:
          h5_path: observations/camera/rgb/left/images
          use_compressed_video: true

    state:
      ### State: 21D = 7 joints + 6 pose + 6 wrench + 1 gripper + 1 timestamp
      
      sub_state:
        ### Left arm joints (7)
        - names:
            - left_arm_joint_0
            - left_arm_joint_1
            - left_arm_joint_2
            - left_arm_joint_3
            - left_arm_joint_4
            - left_arm_joint_5
            - left_arm_joint_6
          args:
            h5_path: observations/arm/left/joints
            range_from: 0
            range_to: 7
          convert_func: to_float32

        ### Left arm end effector pose (6) - xyz + rpy
        - names:
            - left_arm_pose_x
            - left_arm_pose_y
            - left_arm_pose_z
            - left_arm_pose_roll
            - left_arm_pose_pitch
            - left_arm_pose_yaw
          args:
            h5_path: observations/arm/left/pose
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Left arm wrench (6) - force xyz + torque xyz
        - names:
            - left_arm_wrench_fx
            - left_arm_wrench_fy
            - left_arm_wrench_fz
            - left_arm_wrench_tx
            - left_arm_wrench_ty
            - left_arm_wrench_tz
          args:
            h5_path: observations/arm/left/wrench
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Left gripper position (1)
        - names:
            - left_effector_position
          args:
            h5_path: observations/effector/left/position
            range_from: 0
            range_to: 1
          convert_func: to_float32

        ### Timestamp (1)
        - names:
            - timestamp
          args:
            h5_path: observations/timestamp
            range_from: 0
            range_to: 1
          convert_func: to_float32

  action:
    ### Action: 20D = 7 joints + 6 pose + 6 wrench + 1 gripper
    ### 使用 timeline_offset: 1 从下一帧获取 action
    
    timeline_offset: 1
    
    sub_action:
      ### Left arm joints (7)
      - names:
          - left_arm_joint_0
          - left_arm_joint_1
          - left_arm_joint_2
          - left_arm_joint_3
          - left_arm_joint_4
          - left_arm_joint_5
          - left_arm_joint_6
        args:
          h5_path: observations/arm/left/joints
          range_from: 0
          range_to: 7
        convert_func: to_float32

      ### Left arm end effector pose (6)
      - names:
          - left_arm_pose_x
          - left_arm_pose_y
          - left_arm_pose_z
          - left_arm_pose_roll
          - left_arm_pose_pitch
          - left_arm_pose_yaw
        args:
          h5_path: observations/arm/left/pose
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Left arm wrench (6)
      - names:
          - left_arm_wrench_fx
          - left_arm_wrench_fy
          - left_arm_wrench_fz
          - left_arm_wrench_tx
          - left_arm_wrench_ty
          - left_arm_wrench_tz
        args:
          h5_path: observations/arm/left/wrench
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Left gripper (1)
      - names:
          - left_effector_position
        args:
          h5_path: observations/effector/left/position
          range_from: 0
          range_to: 1
        convert_func: to_float32
