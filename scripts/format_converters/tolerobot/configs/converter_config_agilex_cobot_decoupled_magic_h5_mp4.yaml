fps: 30  # 视频是30fps
features:
  observation:
    images:
      # 前置相机 (正视视角)
      - cam_name: cam_front_rgb
        args:
          cam_name: cam_front
          video_file_pattern: "*front.mp4"

      # 左腕相机 (左臂手腕视角)
      - cam_name: cam_left_wrist_rgb
        args:
          cam_name: cam_left_wrist
          video_file_pattern: "*left.mp4"

      # 右腕相机 (右臂手腕视角)
      - cam_name: cam_right_wrist_rgb
        args:
          cam_name: cam_right_wrist
          video_file_pattern: "*right.mp4"

    state:
      # 状态向量: 14维 (左臂7维 + 右臂7维)
      # 每个臂: 6个关节 + 1个夹爪
      sub_state:
        # 左臂关节状态 (6维)
        - names:
            - left_arm_joint_1_rad
            - left_arm_joint_2_rad
            - left_arm_joint_3_rad
            - left_arm_joint_4_rad
            - left_arm_joint_5_rad
            - left_arm_joint_6_rad
          args:
            h5_path: qpos  # 注意: 这个数据集没有observations/qpos嵌套, 直接是qpos
            range_from: 0
            range_to: 6

        # 左臂夹爪状态 (1维)
        - names:
            - left_gripper_open
          args:
            h5_path: qpos
            range_from: 6
            range_to: 7

        # 右臂关节状态 (6维)
        - names:
            - right_arm_joint_1_rad
            - right_arm_joint_2_rad
            - right_arm_joint_3_rad
            - right_arm_joint_4_rad
            - right_arm_joint_5_rad
            - right_arm_joint_6_rad
          args:
            h5_path: qpos
            range_from: 7
            range_to: 13

        # 右臂夹爪状态 (1维)
        - names:
            - right_gripper_open
          args:
            h5_path: qpos
            range_from: 13
            range_to: 14

  action:
    # 动作向量: 14维 (左臂7维 + 右臂7维)
    # 每个臂: 6个关节 + 1个夹爪
    # timeline_offset=1 表示动作比状态提前1帧 (action[t] 对应 state[t+1])
    timeline_offset: 1
    sub_action:
      # 左臂关节动作 (6维)
      - names:
          - left_arm_joint_1_rad
          - left_arm_joint_2_rad
          - left_arm_joint_3_rad
          - left_arm_joint_4_rad
          - left_arm_joint_5_rad
          - left_arm_joint_6_rad
        args:
          h5_path: action  # 注意: 直接是action, 没有嵌套
          range_from: 0
          range_to: 6

      # 左臂夹爪动作 (1维)
      - names:
          - left_gripper_open
        args:
          h5_path: action
          range_from: 6
          range_to: 7

      # 右臂关节动作 (6维)
      - names:
          - right_arm_joint_1_rad
          - right_arm_joint_2_rad
          - right_arm_joint_3_rad
          - right_arm_joint_4_rad
          - right_arm_joint_5_rad
          - right_arm_joint_6_rad
        args:
          h5_path: action
          range_from: 7
          range_to: 13

      # 右臂夹爪动作 (1维)
      - names:
          - right_gripper_open
        args:
          h5_path: action
          range_from: 13
          range_to: 14

# 数据集特征说明:
# - 双臂机器人 (Agilex Cobot Decoupled Magic / ALOHA)
# - 每臂 6 个关节 + 1 个夹爪 (共14维)
# - 3个RGB相机: 前置相机 (front), 左腕相机 (left), 右腕相机 (right)
# - 分辨率: 1280x720 @ 30fps
# - HDF5结构: qpos(T,14), action(T,14), 扁平结构 (无observations嵌套)
# - 目录结构: 任务/颜色/episode/{data.hdf5, front.mp4, left.mp4, right.mp4}
# - 数据集路径: /mnt/nas/synnas/docker/外部数据/aloha15000条
