### 智平方数据集配置 - 右臂版本（包含 arm pose）- 压缩视频格式
### 
### 使用场景：单右臂操作，包含右臂 pose 数据，图像以压缩视频格式存储
### - observations/camera/rgb/head/video: ✅ 有数据（压缩视频）
### - observations/camera/rgb/right/video: ✅ 有数据（压缩视频）
### - observations/arm/right/joints: ✅ 有数据
### - observations/arm/right/pose: ✅ 有数据
### - observations/arm/right/wrench: ✅ 有数据

fps: 30

features:
  observation:
    images:
      ### 两相机配置 - 使用压缩视频格式
      - cam_name: camera_head_rgb
        args:
          h5_path: observations/camera/rgb/head/images
          use_compressed_video: true

      - cam_name: camera_right_wrist_rgb
        args:
          h5_path: observations/camera/rgb/right/images
          use_compressed_video: true

    state:
      ### State: 21D = 7 joints + 6 pose + 6 wrench + 1 gripper + 1 timestamp
      
      sub_state:
        ### Right arm joints (7)
        - names:
            - right_arm_joint_0
            - right_arm_joint_1
            - right_arm_joint_2
            - right_arm_joint_3
            - right_arm_joint_4
            - right_arm_joint_5
            - right_arm_joint_6
          args:
            h5_path: observations/arm/right/joints
            range_from: 0
            range_to: 7
          convert_func: to_float32

        ### Right arm end effector pose (6) - xyz + rpy
        - names:
            - right_arm_pose_x
            - right_arm_pose_y
            - right_arm_pose_z
            - right_arm_pose_roll
            - right_arm_pose_pitch
            - right_arm_pose_yaw
          args:
            h5_path: observations/arm/right/pose
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Right arm wrench (6) - force xyz + torque xyz
        - names:
            - right_arm_wrench_fx
            - right_arm_wrench_fy
            - right_arm_wrench_fz
            - right_arm_wrench_tx
            - right_arm_wrench_ty
            - right_arm_wrench_tz
          args:
            h5_path: observations/arm/right/wrench
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Right gripper position (1)
        - names:
            - right_effector_position
          args:
            h5_path: observations/effector/right/position
            range_from: 0
            range_to: 1
          convert_func: to_float32

        ### Timestamp (1)
        - names:
            - timestamp
          args:
            h5_path: observations/timestamp
            range_from: 0
            range_to: 1
          convert_func: to_float32

  action:
    ### Action: 20D = 7 joints + 6 pose + 6 wrench + 1 gripper
    ### 使用 timeline_offset: 1 从下一帧获取 action
    
    timeline_offset: 1
    
    sub_action:
      ### Right arm joints (7)
      - names:
          - right_arm_joint_0
          - right_arm_joint_1
          - right_arm_joint_2
          - right_arm_joint_3
          - right_arm_joint_4
          - right_arm_joint_5
          - right_arm_joint_6
        args:
          h5_path: observations/arm/right/joints
          range_from: 0
          range_to: 7
        convert_func: to_float32

      ### Right arm end effector pose (6)
      - names:
          - right_arm_pose_x
          - right_arm_pose_y
          - right_arm_pose_z
          - right_arm_pose_roll
          - right_arm_pose_pitch
          - right_arm_pose_yaw
        args:
          h5_path: observations/arm/right/pose
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Right arm wrench (6)
      - names:
          - right_arm_wrench_fx
          - right_arm_wrench_fy
          - right_arm_wrench_fz
          - right_arm_wrench_tx
          - right_arm_wrench_ty
          - right_arm_wrench_tz
        args:
          h5_path: observations/arm/right/wrench
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Right gripper (1)
      - names:
          - right_effector_position
        args:
          h5_path: observations/effector/right/position
          range_from: 0
          range_to: 1
        convert_func: to_float32
