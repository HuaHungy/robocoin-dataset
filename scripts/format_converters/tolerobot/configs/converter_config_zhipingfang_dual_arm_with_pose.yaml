### 智平方数据集配置 - 双臂版本（包含 arm pose）
### 
### 使用场景：双臂操作，包含左右臂 pose 数据
### - observations/camera/rgb/head/images: ✅ 有数据
### - observations/camera/rgb/left/images: ✅ 有数据
### - observations/camera/rgb/right/images: ✅ 有数据
### - observations/camera/rgb/chest/images: ✅ 有数据
### - observations/arm/left/joints: ✅ 有数据
### - observations/arm/left/pose: ✅ 有数据
### - observations/arm/left/wrench: ✅ 有数据
### - observations/arm/right/joints: ✅ 有数据
### - observations/arm/right/pose: ✅ 有数据
### - observations/arm/right/wrench: ✅ 有数据

fps: 30

features:
  observation:
    images:
      ### 完整的四相机配置
      - cam_name: camera_head_rgb
        args:
          h5_path: observations/camera/rgb/head/images

      - cam_name: camera_right_wrist_rgb
        args:
          h5_path: observations/camera/rgb/right/images

      - cam_name: camera_left_wrist_rgb
        args:
          h5_path: observations/camera/rgb/left/images
      
      - cam_name: camera_chest_rgb
        args:
          h5_path: observations/camera/rgb/chest/images

    state:
      ### State: 40D = 7 left joints + 6 left pose + 6 left wrench + 1 left gripper + 7 right joints + 6 right pose + 6 right wrench + 1 right gripper
      
      sub_state:
        ### Left arm joints (7)
        - names:
            - left_arm_joint_0
            - left_arm_joint_1
            - left_arm_joint_2
            - left_arm_joint_3
            - left_arm_joint_4
            - left_arm_joint_5
            - left_arm_joint_6
          args:
            h5_path: observations/arm/left/joints
            range_from: 0
            range_to: 7
          convert_func: to_float32

        ### Left arm end effector pose (6) - xyz + rpy
        - names:
            - left_arm_pose_x
            - left_arm_pose_y
            - left_arm_pose_z
            - left_arm_pose_roll
            - left_arm_pose_pitch
            - left_arm_pose_yaw
          args:
            h5_path: observations/arm/left/pose
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Left arm wrench (6) - force xyz + torque xyz
        - names:
            - left_arm_wrench_fx
            - left_arm_wrench_fy
            - left_arm_wrench_fz
            - left_arm_wrench_tx
            - left_arm_wrench_ty
            - left_arm_wrench_tz
          args:
            h5_path: observations/arm/left/wrench
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Left gripper position (1)
        - names:
            - left_effector_position
          args:
            h5_path: observations/effector/left/position
            range_from: 0
            range_to: 1
          convert_func: to_float32

        ### Right arm joints (7)
        - names:
            - right_arm_joint_0
            - right_arm_joint_1
            - right_arm_joint_2
            - right_arm_joint_3
            - right_arm_joint_4
            - right_arm_joint_5
            - right_arm_joint_6
          args:
            h5_path: observations/arm/right/joints
            range_from: 0
            range_to: 7
          convert_func: to_float32

        ### Right arm end effector pose (6) - xyz + rpy
        - names:
            - right_arm_pose_x
            - right_arm_pose_y
            - right_arm_pose_z
            - right_arm_pose_roll
            - right_arm_pose_pitch
            - right_arm_pose_yaw
          args:
            h5_path: observations/arm/right/pose
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Right arm wrench (6) - force xyz + torque xyz
        - names:
            - right_arm_wrench_fx
            - right_arm_wrench_fy
            - right_arm_wrench_fz
            - right_arm_wrench_tx
            - right_arm_wrench_ty
            - right_arm_wrench_tz
          args:
            h5_path: observations/arm/right/wrench
            range_from: 0
            range_to: 6
          convert_func: to_float32

        ### Right gripper position (1)
        - names:
            - right_effector_position
          args:
            h5_path: observations/effector/right/position
            range_from: 0
            range_to: 1
          convert_func: to_float32

  action:
    ### Action: 40D = 7 left joints + 6 left pose + 6 left wrench + 1 left gripper + 7 right joints + 6 right pose + 6 right wrench + 1 right gripper
    ### 使用 timeline_offset: 1 从下一帧获取 action
    
    timeline_offset: 1
    
    sub_action:
      ### Left arm joints (7)
      - names:
          - left_arm_joint_0
          - left_arm_joint_1
          - left_arm_joint_2
          - left_arm_joint_3
          - left_arm_joint_4
          - left_arm_joint_5
          - left_arm_joint_6
        args:
          h5_path: observations/arm/left/joints
          range_from: 0
          range_to: 7
        convert_func: to_float32

      ### Left arm end effector pose (6)
      - names:
          - left_arm_pose_x
          - left_arm_pose_y
          - left_arm_pose_z
          - left_arm_pose_roll
          - left_arm_pose_pitch
          - left_arm_pose_yaw
        args:
          h5_path: observations/arm/left/pose
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Left arm wrench (6)
      - names:
          - left_arm_wrench_fx
          - left_arm_wrench_fy
          - left_arm_wrench_fz
          - left_arm_wrench_tx
          - left_arm_wrench_ty
          - left_arm_wrench_tz
        args:
          h5_path: observations/arm/left/wrench
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Left gripper (1)
      - names:
          - left_effector_position
        args:
          h5_path: observations/effector/left/position
          range_from: 0
          range_to: 1
        convert_func: to_float32

      ### Right arm joints (7)
      - names:
          - right_arm_joint_0
          - right_arm_joint_1
          - right_arm_joint_2
          - right_arm_joint_3
          - right_arm_joint_4
          - right_arm_joint_5
          - right_arm_joint_6
        args:
          h5_path: observations/arm/right/joints
          range_from: 0
          range_to: 7
        convert_func: to_float32

      ### Right arm end effector pose (6)
      - names:
          - right_arm_pose_x
          - right_arm_pose_y
          - right_arm_pose_z
          - right_arm_pose_roll
          - right_arm_pose_pitch
          - right_arm_pose_yaw
        args:
          h5_path: observations/arm/right/pose
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Right arm wrench (6)
      - names:
          - right_arm_wrench_fx
          - right_arm_wrench_fy
          - right_arm_wrench_fz
          - right_arm_wrench_tx
          - right_arm_wrench_ty
          - right_arm_wrench_tz
        args:
          h5_path: observations/arm/right/wrench
          range_from: 0
          range_to: 6
        convert_func: to_float32

      ### Right gripper (1)
      - names:
          - right_effector_position
        args:
          h5_path: observations/effector/right/position
          range_from: 0
          range_to: 1
        convert_func: to_float32
